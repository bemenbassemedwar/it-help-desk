<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="utf-8" />
    <title>IT Help Desk</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500&family=Cairo:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/icon?family=Material+Icons"
      rel="stylesheet"
    />
    <script>
      // Apply saved preferences before first render to prevent flash
      try {
        var prefs = JSON.parse(localStorage.getItem('it-helpdesk-prefs') || '{}');
        var html = document.documentElement;
        if (prefs.language === 'ar') {
          html.setAttribute('lang', 'ar');
          html.setAttribute('dir', 'rtl');
        }
        if (prefs.theme === 'dark' || (prefs.theme === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
          html.classList.add('dark-theme');
        } else if (prefs.theme !== 'dark') {
          html.classList.add('light-theme');
        }
      } catch(e) {}
    </script>
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
